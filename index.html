<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Healthy Food Reviews</title>
  </head>
  <body>
    <main>
      <input
        type="text"
        id="product-search"
        placeholder="Search for a product..."
      />

      <div id="product-search-results"></div>

      <h1>Primal Kitchen Organic Unsweetened Ketchup</h1>
      <h2>Community Rating</h2>
      <p id="average-rating"></p>
      <p id="review-count"></p>

      <h2>Would You Buy It Again?</h2>
      <p id="buy-again-percentage"></p>

      <h2>Community Reviews</h2>
      <div id="reviews-list"></div>

      <button type="button">Write Review</button>

      <a
        href="https://www.amazon.com/Primal-Kitchen-Organic-Unsweetened-Ketchup/dp/B00K5N1X6A"
        target="_blank"
        >Primal Kitchen</a
      >
      <img src="ketchup.jpg" alt="Ketchup" width="300" height="200" />

      <p>Write a Review</p>

      <form id="reviewform">
        <label for="name">Your Name:</label><br />
        <input type="text" id="name" name="name" required /><br /><br />

        <label for="rating">Rating (1-5):</label><br />
        <input
          type="number"
          id="rating"
          name="rating"
          min="1"
          max="5"
          required
        /><br /><br />

        <label for="review">Your Review:</label>
        <textarea
          id="review"
          name="review"
          rows="4"
          cols="50"
          required
        ></textarea>

        <p>Would you buy it again?</p>

        <label for="yes">Yes</label>
        <input type="radio" id="yes" name="buyAgain" value="yes" required />

        <label for="no">No</label>
        <input type="radio" id="no" name="buyAgain" value="no" required />

        <button type="submit">Submit Review</button>
      </form>

      <p id="message"></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
